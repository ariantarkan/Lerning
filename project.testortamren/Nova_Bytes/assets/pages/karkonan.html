<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Section - Nova Bytes</title>
    <!-- Add icon font for social media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/project.testortamren/Nova_Bytes/assets/css/karkonan.css">
</head>
<body>

    <section class="team-section">
        <h2 class="section-title">Our Team Members</h2>
        
        <div class="team-grid">
            
            <!-- First member card -->
            <div class="team-card">
                <div class="member-img-wrapper">
                    <!-- Replace the link below with the actual image URL -->
                    <img src="https://via.placeholder.com/150/1a1a2e/45a29e?text=Ali" alt="Ali Rezaei" class="member-img">
                </div>
                <h3 class="member-name">علی رضایی</h3>
                <div class="member-role">توسعه‌دهنده فرانت‌اند</div>
                <p class="member-bio">علاقه‌مند به خلق رابط‌های کاربری روان و تجربه‌های تعاملی جذاب.</p>
                <div class="skills">
                    <span class="skill-tag">React</span>
                    <span class="skill-tag">Vue.js</span>
                    <span class="skill-tag">Tailwind</span>
                </div>
                <div class="social-links">
                    <a href="#" class="social-icon"><i class="fab fa-github"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>

            <!-- Second member card -->
            <div class="team-card">
                <div class="member-img-wrapper">
                    <img src="https://via.placeholder.com/150/1a1a2e/8a2be2?text=Sara" alt="Sara Mousavi" class="member-img">
                </div>
                <h3 class="member-name">سارا موسوی</h3>
                <div class="member-role">توسعه‌دهنده بک‌اند</div>
                <p class="member-bio">متخصص در معماری دیتابیس‌های مقیاس‌پذیر و امنیت سرور.</p>
                <div class="skills">
                    <span class="skill-tag">Django</span>
                    <span class="skill-tag">Node.js</span>
                    <span class="skill-tag">PostgreSQL</span>
                </div>
                <div class="social-links">
                    <a href="#" class="social-icon"><i class="fab fa-github"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>

            

        </div>
    </section>

</body>
</html>
