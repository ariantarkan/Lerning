<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-fa="پنل مدیریت مدرن" data-en="Modern Admin Panel">پنل مدیریت مدرن</title>
    <link rel="stylesheet" href="/project.testortamren/test/assets/css/style.css" />
  </head>
  <body>
    <!-- Overlay برای بستن منو در موبایل -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- منوی کناری -->
    <div class="sidebar" id="sidebar">
      <div class="logo" data-fa="ادمین پنل" data-en="Admin Panel">ادمین پنل</div>

      <a href="/project.testortamren/test/assets/page/index.html" class="menu-item active">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span data-fa="داشبورد" data-en="Dashboard">داشبورد</span>
      </a>

      <a href="/project.testortamren/test/assets/page/محصولات.html" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span data-fa="محصولات" data-en="Products">محصولات</span>
      </a>

      <a href="/project.testortamren/test/assets/page/کاربران.html" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span data-fa="کاربران" data-en="Users">کاربران</span>
      </a>

      <a href="/project.testortamren/test/assets/page/امار وگزارش.html" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span data-fa="آمار و گزارش‌ها" data-en="Reports & Stats">آمار و گزارش‌ها</span>
      </a>

      <a href="#" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
        <span data-fa="کنسول" data-en="Console">کنسول</span>
      </a>

      <a href="/project.testortamren/test/assets/page/تیکت.html" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span data-fa="تیکت ها" data-en="Tickets">تیکت ها</span>
      </a>

      <a href="/project.testortamren/test/assets/page/دیتاسینتر.html" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
        <span data-fa="دیتاسنتر" data-en="Datacenter">دیتاسنتر</span>
      </a>

      <a href="#settings" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span data-fa="تنظیمات" data-en="Settings">تنظیمات</span>
      </a>
    </div>

    <!-- محتوای اصلی -->
    <div class="main-content">
      <!-- هدر -->
      <div class="header">
        <div class="search-bar">
          <input type="text" data-fa="جستجو..." data-en="Search..." placeholder="جستجو..." id="searchInput"/>
        </div>

        <div class="header-left">
          <div class="user-profile">
            <span data-fa="مدیر سیستم" data-en="System Admin">مدیر سیستم</span>
            <div class="avatar" data-fa="م" data-en="A">م</div>
          </div>

          <button class="menu-toggle" onclick="toggleSidebar()">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <!-- کارت‌های آماری -->
      <div class="grid-cards">
        <div class="card">
          <div class="card-title" data-fa="تعداد محصولات" data-en="Total Products">تعداد محصولات</div>
          <div class="card-value">892</div>
        </div>
        <div class="card">
          <div class="card-title" data-fa="کاربران فعال" data-en="Active Users">کاربران فعال</div>
          <div class="card-value">562</div>
        </div>
        <div class="card">
          <div class="card-title" data-fa="تیکت‌های باز" data-en="Open Tickets">تیکت‌های باز</div>
          <div class="card-value">24</div>
        </div>
        <div class="card">
          <div class="card-title" data-fa="درآمد کل" data-en="Total Revenue">درآمد کل</div>
          <div class="card-value">84M</div>
        </div>
      </div>

      <!-- بخش نمودارها -->
      <div class="charts-grid">
        <div class="chart-box">
          <h3 style="margin-bottom: 15px; color: var(--text-main)" data-fa="نمودار آمار کلی" data-en="General Stats Chart">نمودار آمار کلی</h3>
          <div style="background: var(--bg-color); height: 80%; border-radius: 8px; display: flex; justify-content: center; align-items: center; color: var(--text-muted);">
            <span data-fa="محل قرارگیری نمودار (Chart.js)" data-en="Chart PlaceHolder">محل قرارگیری نمودار (Chart.js)</span>
          </div>
        </div>
        <div class="chart-box">
          <h3 style="margin-bottom: 15px; color: var(--text-main)" data-fa="وضعیت پروژه‌ها" data-en="Projects Status">وضعیت پروژه‌ها</h3>
          <div style="background: var(--bg-color); height: 80%; border-radius: 8px; border: 4px solid var(--primary-color); display: flex; justify-content: center; align-items: center; border-radius: 50%; width: 200px; height: 200px; margin: 0 auto; color: var(--text-muted);">
            <span data-fa="نمودار دایره‌ای" data-en="Pie Chart">نمودار دایره‌ای</span>
          </div>
        </div>
      </div>
    </div>

    <!-- اسکریپت‌ها -->
    <script src="/project.testortamren/test/assets/js/page.js"></script>
    <script src="/project.testortamren/test/assets/js/app.js"></script>
    
    <!-- کد جاوااسکریپت برای اصلاح placeholder اینپوت جستجو -->

  </body>
</html>
