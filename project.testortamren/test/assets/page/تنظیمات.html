<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تنظیمات ادمین پنل</title>
    <link rel="stylesheet" href="/project.testortamren/test/assets/css/تنظیمات.css">
  </head>
  <body>
    <!-- بک‌گراند تیره برای زمان باز بودن منو در موبایل -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- هدر مخصوص موبایل با دکمه همبرگری -->
    <div class="mobile-header">
      <h2
        style="margin: 0; font-size: 18px"
        data-fa="تنظیمات"
        data-en="Settings"
      >
        تنظیمات
      </h2>
      <button class="menu-toggle-btn" id="menuToggleBtn">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- سایدبار -->
    <div class="sidebar" id="sidebar">
      <div class="logo">ادمین پنل</div>

      <a
        href="/project.testortamren/test/assets/page/index.html"
        class="menu-item"
      >
        <svg
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span data-fa="داشبورد" data-en="Dashboard">داشبورد</span>
      </a>

      <a
        href="/project.testortamren/test/assets/page/محصولات.html"
        class="menu-item"
      >
        <svg
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <path
            d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
          ></path>
        </svg>
        محصولات
      </a>

      <a
        href="/project.testortamren/test/assets/page/کاربران.html"
        class="menu-item"
      >
        <svg
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        کاربران
      </a>

      <a
        href="/project.testortamren/test/assets/page/امار وگزارش.html"
        class="menu-item"
      >
        <svg
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        آمار و گزارش‌ها
      </a>

      <!-- کنسول -->
      <a href="#" class="menu-item">
        <svg
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        کنسول
      </a>

      <!-- تیکت ها -->
      <a
        href="/project.testortamren/test/assets/page/تیکت.html"
        class="menu-item active"
      >
        <svg
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <path
            d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
          ></path>
        </svg>
        تیکت ها
      </a>

      <!-- دیتاسنتر (آیکون سرور) -->
      <a
        href="/project.testortamren/test/assets/page/دیتاسینتر.html"
        class="menu-item"
      >
        <svg
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
          <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
          <line x1="6" y1="6" x2="6.01" y2="6"></line>
          <line x1="6" y1="18" x2="6.01" y2="18"></line>
        </svg>
        دیتاسنتر
      </a>

      <a href="#settings" class="menu-item">
        <svg
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
          ></path>
        </svg>
        تنظیمات
      </a>
    </div>

    <!-- محتوای تنظیمات -->
    <div class="settings-container">
      <h1 class="page-title" data-fa="تنظیمات" data-en="Settings">تنظیمات</h1>

      <div class="cards-grid">
        <!-- کارت حساب کاربری -->
        <div class="card">
          <div class="card-header">
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <h2 class="card-title" data-fa="حساب کاربری" data-en="Account">
              حساب کاربری
            </h2>
          </div>
          <ul class="setting-list">
            <li class="setting-item" onclick="openModal('name-modal')">
              <span class="item-text" data-fa="ویرایش نام" data-en="Edit Name"
                >ویرایش نام</span
              >
              <svg class="chevron" viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </li>
            <li class="setting-item" onclick="openModal('email-modal')">
              <span
                class="item-text"
                data-fa="ویرایش ایمیل"
                data-en="Edit Email"
                >ویرایش ایمیل</span
              >
              <svg class="chevron" viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </li>
            <li class="setting-item" onclick="openModal('password-modal')">
              <span
                class="item-text"
                data-fa="تغییر رمز عبور"
                data-en="Change Password"
                >تغییر رمز عبور</span
              >
              <svg class="chevron" viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </li>
          </ul>
        </div>

        <!-- کارت اعلان‌ها -->
        <div class="card">
          <div class="card-header">
            <svg viewBox="0 0 24 24">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <h2 class="card-title" data-fa="اعلان‌ها" data-en="Notifications">
              اعلان‌ها
            </h2>
          </div>
          <ul class="setting-list">
            <li class="setting-item">
              <span
                class="item-text"
                data-fa="اعلان سفارش‌های جدید"
                data-en="New Orders"
                >اعلان سفارش‌های جدید</span
              >
              <label class="toggle-switch"
                ><input type="checkbox" checked /><span class="slider"></span
              ></label>
            </li>
            <li class="setting-item">
              <span
                class="item-text"
                data-fa="دریافت ایمیل"
                data-en="Email Notifications"
                >دریافت ایمیل</span
              >
              <label class="toggle-switch"
                ><input type="checkbox" checked /><span class="slider"></span
              ></label>
            </li>
          </ul>
        </div>

        <!-- کارت ظاهر و عمومی -->
        <div class="card">
          <div class="card-header">
            <svg viewBox="0 0 24 24">
              <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
              <path d="M2 2l7.586 7.586"></path>
              <circle cx="11" cy="11" r="2"></circle>
            </svg>
            <h2
              class="card-title"
              data-fa="ظاهر و عمومی"
              data-en="Appearance & General"
            >
              ظاهر و عمومی
            </h2>
          </div>
          <ul class="setting-list">
            <li class="setting-item">
              <span
                class="item-text"
                data-fa="حالت تاریک (Dark Mode)"
                data-en="Dark Mode"
                >حالت تاریک (Dark Mode)</span
              >
              <label class="toggle-switch"
                ><input type="checkbox" id="darkModeToggle" /><span
                  class="slider"
                ></span
              ></label>
            </li>
            <li class="setting-item" style="cursor: default">
              <span
                class="item-text"
                data-fa="زبان سیستم"
                data-en="System Language"
                >زبان سیستم</span
              >
              <select class="custom-select" id="languageSelect">
                <option value="fa">فارسی</option>
                <option value="en">English</option>
              </select>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- پاپ‌آپ‌ها -->
    <div class="modal-overlay" id="name-modal">
      <div class="modal-box">
        <h3 class="modal-title" data-fa="ویرایش نام" data-en="Edit Name">
          ویرایش نام
        </h3>
        <input
          type="text"
          class="modal-input"
          placeholder="نام جدید را وارد کنید..."
          id="input-name"
        />
        <div class="modal-actions">
          <button
            class="btn btn-cancel"
            onclick="closeModals()"
            data-fa="انصراف"
            data-en="Cancel"
          >
            انصراف
          </button>
          <button
            class="btn btn-save"
            onclick="saveData('name')"
            data-fa="ذخیره"
            data-en="Save"
          >
            ذخیره
          </button>
        </div>
      </div>
    </div>
    <!-- (پاپ‌آپ‌های دیگر با همین الگو در اینجا قرار می‌گیرند، برای اختصار در این کد کوتاه شده‌اند اما در فایل اصلی خود نگه دارید) -->

    <script src="/project.testortamren/test/assets/js/app.js">
      // --- کدهای مربوط به منوی موبایل ---

    </script>
  </body>
</html>
